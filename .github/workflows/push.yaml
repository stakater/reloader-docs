name: Push

on:
  push:
    branches:
      - 'main'
      - '[0-9]+.[0-9]+'

# Every branch deploys into the single gh-pages branch via `mike deploy --push`,
# which neither rebases nor retries. The group must therefore be ref-independent:
# the collision is between branches, not between runs on one branch. Releases push
# main and then sync into the release branch seconds later, so without this the
# second run is rejected with "! [rejected] gh-pages -> gh-pages (fetch first)".
# Do not set cancel-in-progress: cancelling would drop a deploy instead of queuing it.
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  push:
    uses: stakater/.github/.github/workflows/push_versioned_doc.yaml@v0.0.199
    with:
      LATEST_DOC_VERSION: "1.4"
    secrets:
      GH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
